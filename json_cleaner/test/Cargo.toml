[package]
name = "json_cleaner"
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
description = "Regolith filter: removes comments (and optionally whitespace / root $schema) from JSON files"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
walkdir = "2.5"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"
tempfile = "3"

[[bench]]
name = "transform"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Same code generation as `release` but with symbols kept for profilers.
[profile.profiling]
inherits = "release"
strip = false
debug = true
